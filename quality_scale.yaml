# Home Assistant integration quality scale — gap list for whisker_ting.
#
# WHY THIS FILE EXISTS AND WHAT IT IS NOT. LAW §15 makes the quality scale the
# build standard for every custom_components/* repo in this estate: Bronze is
# the floor for anything shipped, Silver the target for anything reading a
# device, a service, or another integration's entities. This is a `device`
# integration on `cloud_push` against a vendor cloud, so **Silver is the
# target** — and it is not met yet. Every row below is a judgement made by
# reading this repo's code, not a claim of a tier.
#
# NOTHING VALIDATES THIS FILE. hassfest's `validate_iqs_file` opens with
# `if not integration.core: return`, so a custom component's quality_scale.yaml
# is never read — while manifest.json's schema still *accepts* a
# `quality_scale` key. A tier declared there would be a self-claim with no gate
# behind it, green forever, so **manifest.json declares none** and will not
# until the rows below say it has been earned. The rule names and tiers here
# were read from `ALL_RULES` in home-assistant/core's
# `script/hassfest/quality_scale.py`, never from the docs page, which names the
# tiers and not the rules. `.github/scripts/check_quality_scale.py` checks the
# row set against that list on every push, so the file cannot silently drift
# out of date with the standard it is measured against. That script lives under
# `.github/` rather than in a `tools/` directory on purpose: hacs.json declares
# `content_in_root`, so anything at the root is copied into every user's
# custom_components directory, and CI tooling has no business shipping there.
#
# Gold and Platinum rows are carried because the schema requires every rule
# name; they are judged honestly but are not this repo's near-term work.

rules:
  # ------------------------------------------------------------------ BRONZE
  action-setup:
    status: exempt
    comment: >-
      Registers no actions. The integration is read-only: there is nothing to
      command on a Ting, which reports and does not actuate.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      brand/icon.png and brand/icon@2x.png are committed at the repository
      root, which under content_in_root is the exact path both HACS's brands
      validator and Home Assistant's own /api/brands/integration/ route read;
      a custom integration serves its own brand images and needs no
      home-assistant/brands PR. validate.yml no longer passes `ignore: brands`
      — the check runs and is enforced. This row said the opposite of all of
      that until #9's pass re-read it.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: >-
      The extraction's lost unit suite is back under tests/ (#9), but it covers
      auth.py and signalr_protocol.py only. Config-flow coverage was never
      written even in jrackerby/HA, and needs
      pytest-homeassistant-custom-component to drive the flow — out of scope
      for a suite whose two modules import no homeassistant at all.
  dependency-transparency:
    status: done
    comment: >-
      One third-party requirement, `msgpack`, open source and published on
      PyPI with no build step of its own. It is declared as `>=1.0.0` rather
      than pinned: this is a HACS component installed against whatever core
      already resolved, so pinning here would fight core's own resolver rather
      than reproduce anything.
  docs-actions:
    status: exempt
    comment: Registers no actions, so there are none to document.
  docs-conditions:
    status: exempt
    comment: Registers no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Registers no triggers.
  entity-event-setup:
    status: done
    comment: >-
      Entities subscribe through CoordinatorEntity, which attaches in
      async_added_to_hass and detaches on removal. The SignalR sockets are
      owned by the coordinator, not by any entity, so no entity holds a
      subscription of its own that could outlive it.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: >-
      The coordinator is stored on `entry.runtime_data` and the typed alias
      `WhiskerTingConfigEntry` exists in __init__.py. Honest qualifier: the two
      platform `async_setup_entry` signatures still annotate a bare ConfigEntry
      rather than that alias, so the typing is looser than core's convention
      even though the storage is correct.
  test-before-configure:
    status: done
    comment: >-
      The user step certifies BOTH channels. Cognito plus one REST GET as
      before, then `_probe_signalr` opens one real connection to the SignalR
      hub against the first device — handshake plus InitializeStreaming, on
      the hub's own `custom:api_key` credential and Origin header — and fails
      the step with `cannot_connect_stream` if the hub refuses. It does not
      wait for a reading: voltage arrives when the hub sends it, so waiting
      would make the verdict depend on timing rather than reachability. An
      account with no Ting on it skips the probe, there being no station to
      subscribe to. Closed by #10.
  test-before-setup:
    status: done
    comment: >-
      async_config_entry_first_refresh() gates setup. A rejected credential
      raises ConfigEntryAuthFailed into the reauth flow; a transient REST
      failure with no prior data re-raises and lands as ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: The Whisker user id is the unique id; a second entry for the same account aborts.

  # ------------------------------------------------------------------ SILVER
  action-exceptions:
    status: exempt
    comment: Registers no actions.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry unloads both platforms and, only on success, shuts the
      coordinator down — which cancels every reconnect task and closes every
      SignalR socket before the entry goes.
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      The carry-forward is BOUNDED. A transient REST miss still returns the
      last payload — a hiccup is not the device being gone — but past
      MAX_CARRY_FORWARD_POLLS consecutive failures the coordinator raises
      UpdateFailed, last_update_success goes false and every entity goes
      unavailable, because for a fire-hazard flag "stale" and "clear" are not
      the same fact. The voltage callback is gated on the same state, or a
      live socket calling async_set_updated_data would silently undo the
      unavailability and republish REST-sourced hazard flags nothing had
      refreshed. LAW §15's "apply a rule where it governs": unlike
      household_state's never-raise contract, this integration reads a cloud
      that IS its subject and has a service to lose. Closed by #11.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Both halves. The REST half was already correct — one warning at the
      dwell, one info on recovery, gated on an exact count so it cannot
      repeat. The websocket half now dedups on a stable condition token per
      station, "up" or "down" and nothing else: one warning when the stream is
      lost, one info when it comes back, however many backoff cycles run in
      between. LAW §15 is explicit that a once-only log deduped on its own
      MESSAGE is not once-only — the attempt number and the backoff delay stay
      in the DEBUG line, where repetition is the point, and never in the
      compared token. Closed by #11.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 on both platforms. Every entity reads one shared
      coordinator and none of them writes, so there is nothing to serialise.
  reauthentication-flow:
    status: done
    comment: >-
      ConfigEntryAuthFailed from the coordinator opens async_step_reauth, which
      revalidates against Cognito before updating the entry in place.
  test-coverage:
    status: todo
    comment: >-
      No longer zero: tests/ carries the recovered unit suites for auth.py and
      signalr_protocol.py and validate.yml runs them (#9). This rule wants the
      integration's own setup and teardown covered, which needs
      pytest-homeassistant-custom-component and is a separate, larger job;
      neither module under test imports homeassistant.

  # -------------------------------------------------------------------- GOLD
  devices:
    status: done
    comment: One device per Ting, DeviceInfo defined once in entity.py.
  diagnostics: todo
  discovery:
    status: exempt
    comment: >-
      Nothing to discover. The plug never speaks on the local network — it has
      no documented local API at all — and devices are enumerated from the
      cloud account after sign-in.
  discovery-update-info:
    status: exempt
    comment: Same reason as `discovery`; there is no local endpoint whose address could change.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: done
    comment: >-
      Both platforms register a coordinator listener that adds entities for
      serials it has not seen, so a Ting plugged in after setup appears on the
      next poll instead of waiting for a hand reload. The coordinator opens a
      SignalR socket for the new station on the same pass — per-station, not
      behind one global connected flag, which was why a later device got no
      socket at all. Closed by #12.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      The three noisy diagnostic voltage sensors and average_peaks_max are
      registry-disabled by default; the hazard flags are not.
  entity-translations: done
  exception-translations:
    status: todo
    comment: Exceptions carry plain English strings, not translation keys.
  icon-translations:
    status: todo
    comment: No icons.json; entities fall back to their device-class icons.
  reconfiguration-flow:
    status: todo
    comment: >-
      No async_step_reconfigure. Changing the account means deleting the entry
      and adding it again; reauth covers a changed password but not a changed
      account.
  repair-issues:
    status: todo
    comment: >-
      Nothing raises a repair. The clearest candidate is the positional-float
      fallback in websocket.py, which today only logs a warning that a live
      install has to be reading the log to notice.
  stale-devices:
    status: done
    comment: >-
      A serial that disappears from the account has its device registry row
      released via async_update_device(remove_config_entry_id=...) — not
      async_remove_device, since the row is only ours to delete if no other
      entry still claims it — and its socket closed. Leaving the row behind
      made a removed device read exactly like a cloud outage. Closed by #12.

  # ---------------------------------------------------------------- PLATINUM
  async-dependency:
    status: done
    comment: >-
      All I/O is aiohttp. The one third-party requirement, msgpack, is a codec
      rather than an I/O library — it does no blocking work and there is no
      sync client anywhere to wrap.
  inject-websession:
    status: done
    comment: >-
      async_get_clientsession(hass) is resolved once in async_setup_entry and
      passed into the REST client, the Cognito client and the socket manager.
      Nothing constructs a session of its own.
  strict-typing:
    status: todo
    comment: >-
      No py.typed and no mypy in CI. Annotations are broadly present but
      unproven, and api.py carries three `type: ignore` comments.
